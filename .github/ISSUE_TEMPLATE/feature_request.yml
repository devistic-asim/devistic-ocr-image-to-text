name: Feature request
description: Suggest an improvement to Devistic OCR
title: "Feature: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What is difficult today
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
      description: The app stays in the browser, with no account and no API key. Ideas should fit that.
    validations:
      required: true
