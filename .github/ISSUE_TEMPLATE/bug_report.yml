name: Bug report
description: Something in Devistic OCR does not behave as it should
title: "Bug: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the language, whether you used upload, drop, or paste, and any pre-processing (grayscale, contrast, rotate, crop).
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: Chrome 131 on macOS
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Do not attach images that contain private information.
